name: Release MoneyPal

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (pinned to tag commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Verify tag is reachable from master
        run: |
          DEFAULT_BRANCH=${{ github.event.repository.default_branch }}
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor \
               "${{ github.ref_name }}" \
               "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag ${{ github.ref_name }} no es alcanzable desde origin/$DEFAULT_BRANCH"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate release signing secrets
        env:
          MONEYPAL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MONEYPAL_RELEASE_KEYSTORE_BASE64 }}
          MONEYPAL_RELEASE_STORE_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_STORE_PASSWORD }}
          MONEYPAL_RELEASE_KEY_ALIAS: ${{ secrets.MONEYPAL_RELEASE_KEY_ALIAS }}
          MONEYPAL_RELEASE_KEY_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            MONEYPAL_RELEASE_KEYSTORE_BASE64 \
            MONEYPAL_RELEASE_STORE_PASSWORD \
            MONEYPAL_RELEASE_KEY_ALIAS \
            MONEYPAL_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing or empty secret: $name (add it under Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          MONEYPAL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MONEYPAL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$MONEYPAL_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Write keystore.properties for CI build
        env:
          MONEYPAL_RELEASE_STORE_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_STORE_PASSWORD }}
          MONEYPAL_RELEASE_KEY_ALIAS: ${{ secrets.MONEYPAL_RELEASE_KEY_ALIAS }}
          MONEYPAL_RELEASE_KEY_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release-keystore.jks
          storePassword=${MONEYPAL_RELEASE_STORE_PASSWORD}
          keyAlias=${MONEYPAL_RELEASE_KEY_ALIAS}
          keyPassword=${MONEYPAL_RELEASE_KEY_PASSWORD}
          EOF

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Verify HEAD matches tag
        run: |
          # Use ^{commit} to dereference annotated tags — otherwise
          # rev-parse returns the tag object hash, not the commit hash.
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${{ github.ref_name }}^{commit}")
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::HEAD ($HEAD_SHA) ≠ tag commit ($TAG_SHA)"
            exit 1
          fi

      - name: Run Fastlane release lane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.ref_name }}
          MONEYPAL_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          MONEYPAL_RELEASE_STORE_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_STORE_PASSWORD }}
          MONEYPAL_RELEASE_KEY_ALIAS: ${{ secrets.MONEYPAL_RELEASE_KEY_ALIAS }}
          MONEYPAL_RELEASE_KEY_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_KEY_PASSWORD }}
        run: bundle exec fastlane android publish_github
