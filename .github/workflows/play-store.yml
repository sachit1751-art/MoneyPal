name: Deploy to Google Play

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag to deploy (e.g. v1.5.4)'
        required: true
      track:
        description: 'Play Store track'
        required: false
        default: production
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: play-store-${{ github.event.inputs.version_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build AAB and upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve version tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout (pinned to tag commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify tag is reachable from master
        run: |
          DEFAULT_BRANCH=${{ github.event.repository.default_branch }}
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor \
               "${{ steps.resolve.outputs.tag }}" \
               "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag ${{ steps.resolve.outputs.tag }} no es alcanzable desde origin/$DEFAULT_BRANCH"
            exit 1
          fi

      - name: Verify HEAD matches tag
        run: |
          # Use ^{commit} to dereference annotated tags — otherwise
          # rev-parse returns the tag object hash, not the commit hash.
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${{ steps.resolve.outputs.tag }}^{commit}")
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::HEAD ($HEAD_SHA) ≠ tag commit ($TAG_SHA)"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate release signing secrets
        env:
          MONEYPAL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MONEYPAL_RELEASE_KEYSTORE_BASE64 }}
          MONEYPAL_RELEASE_STORE_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_STORE_PASSWORD }}
          MONEYPAL_RELEASE_KEY_ALIAS: ${{ secrets.MONEYPAL_RELEASE_KEY_ALIAS }}
          MONEYPAL_RELEASE_KEY_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$MONEYPAL_RELEASE_KEYSTORE_BASE64"
          test -n "$MONEYPAL_RELEASE_STORE_PASSWORD"
          test -n "$MONEYPAL_RELEASE_KEY_ALIAS"
          test -n "$MONEYPAL_RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          MONEYPAL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MONEYPAL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$MONEYPAL_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Write Google Play Service Account Key
        env:
          GOOGLE_PLAY_KEY_JSON: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
        run: |
          echo "$GOOGLE_PLAY_KEY_JSON" > fastlane/moneypal-play-service-account.json

      - name: Write keystore.properties for CI build
        env:
          MONEYPAL_RELEASE_STORE_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_STORE_PASSWORD }}
          MONEYPAL_RELEASE_KEY_ALIAS: ${{ secrets.MONEYPAL_RELEASE_KEY_ALIAS }}
          MONEYPAL_RELEASE_KEY_PASSWORD: ${{ secrets.MONEYPAL_RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release-keystore.jks
          storePassword=${MONEYPAL_RELEASE_STORE_PASSWORD}
          keyAlias=${MONEYPAL_RELEASE_KEY_ALIAS}
          keyPassword=${MONEYPAL_RELEASE_KEY_PASSWORD}
          EOF

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Deploy to Google Play
        env:
          VERSION_TAG: ${{ steps.resolve.outputs.tag }}
        run: bundle exec fastlane android deploy_play_store track:${{ github.event.inputs.track || 'production' }}
